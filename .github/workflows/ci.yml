name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cross-platform:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, node: 20, full: true }
          - { os: ubuntu-latest, node: 22, full: true }
          - { os: macos-latest, node: 22, full: false }
          - { os: windows-latest, node: 22, full: false }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: '${{ matrix.node }}', cache: npm }
      - run: npm ci
      - run: npm run build && npm run build:gateway
      - run: npm run test:security
      - run: npm run verify:generated
      - if: matrix.full
        run: npm test
      - if: matrix.full
        run: npm pack --dry-run && npm pack ./packages/installer --dry-run
      # release:preflight validates `npm sbom` output against the CycloneDX 1.6 schema. npm 10
      # (bundled with Node 20 and 22) emits a 1.5 document that can repeat an entry in
      # `dependencies`, which fails the schema's uniqueItems constraint and reports as
      # SBOM_SCHEMA_INVALID even though the dependency tree is fine. publish-npm.yml already
      # pins npm 11 for the OIDC exchange, so pinning here too keeps CI validating the same
      # toolchain that actually publishes rather than a version the release never uses.
      - if: matrix.full
        run: npm install -g npm@11
      - if: matrix.full
        run: npm run release:preflight -- --allow-no-tag
